<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kılıç ve Kalkan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Kılıç ve Kalkan</div>
    <div class="chips" id="chips" hidden>
      <span class="chip"><b id="cName"></b></span>
      <span class="chip">Sv. <b id="cLvl"></b></span>
      <span class="chip">TP <b id="cXp"></b></span>
      <span class="chip gold"><b id="cGold"></b> altın</span>
    </div>
    <button class="btn ghost small" id="soundBtn" type="button" aria-pressed="true">Ses: Açık</button>
  </header>

  <div class="hud" id="hud" hidden>
    <div class="fbox">
      <div class="who" id="pWho"></div>
      <div class="bar hp"><i id="pHp"></i><span id="pHpT"></span></div>
      <div class="bar en"><i id="pEn"></i><span id="pEnT"></span></div>
      <div class="buffs" id="pBuffs"></div>
    </div>
    <div class="crowd">
      <div class="label">Seyirci</div>
      <div class="meter" id="crowdMeter"></div>
      <div class="dist" id="distT"></div>
    </div>
    <div class="fbox right">
      <div class="who" id="eWho"></div>
      <div class="bar hp"><i id="eHp"></i><span id="eHpT"></span></div>
      <div class="bar en"><i id="eEn"></i><span id="eEnT"></span></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="arena" width="384" height="216" aria-label="Arena"></canvas>
  </div>

  <!-- ana menü: görselin üzerindeki butonlar tıklanır alanlardır -->
  <section id="menu" class="screen">
    <div class="title-screen">
      <img class="title-img" src="assets/arayuz/giris.webp" width="1672" height="941" alt="Kılıç ve Kalkan: sancaklar ve meşalelerle çevrili arena kapısı">
      <button class="hot" id="newBtn" type="button" style="top:34.5%">Yeni Oyun</button>
      <button class="hot" id="contBtn" type="button" style="top:46.5%">Devam Et</button>
      <button class="hot" id="howBtn" type="button" style="top:58.5%">Nasıl Oynanır</button>
      <button class="hot" id="setBtn" type="button" style="top:70.5%">Ayarlar</button>
    </div>
    <p class="note" id="contInfo"></p>
  </section>

  <!-- karakter oluşturma -->
  <section id="create" class="screen" hidden>
    <h2>Gladyatörünü oluştur</h2>
    <div class="two">
      <div class="panel">
        <canvas class="portrait" id="createPortrait" width="320" height="320" aria-label="Önizleme"></canvas>
        <div class="field">
          <label class="label" for="nameIn">Adın</label>
          <input type="text" id="nameIn" maxlength="16" value="Aren" autocomplete="off">
        </div>
      </div>
      <div class="panel">
        <div class="row between">
          <span class="label">Özellik puanları</span>
          <span><b class="pts" id="createPts"></b> <span class="note">puan kaldı</span></span>
        </div>
        <div class="stats" id="createStats"></div>
        <div class="row">
          <button class="btn" id="startBtn" type="button">Başla</button>
          <button class="btn ghost" id="backMenuBtn" type="button">Geri</button>
        </div>
        <p class="note" id="createNote"></p>
      </div>
    </div>
  </section>

  <!-- şehir menüsü: görselin üzerindeki binalar, butonlar ve sol üst panel tıklanır -->
  <section id="city" class="screen" hidden>
    <div class="city-screen" id="cityScreen">
      <img class="city-img" src="assets/arayuz/sehir.webp" width="1672" height="941" alt="Vesperum: ortada arena, solda demirci ve eğitim alanı, sağda zırhçı ve iksirci">
      <button class="spot" data-go="demirci" type="button" style="left:0;top:26.6%;width:20.3%;height:54.2%">Demirci</button>
      <button class="spot" data-go="arena" type="button" style="left:26.3%;top:11.7%;width:47.2%;height:57.4%">Arena</button>
      <button class="spot" data-go="egitim" type="button" style="left:22.1%;top:44.6%;width:16.7%;height:34%">Eğitim Alanı</button>
      <button class="spot" data-go="zirhci" type="button" style="left:61.6%;top:42.5%;width:20.9%;height:39.3%">Zırhçı</button>
      <button class="spot" data-go="iksirci" type="button" style="left:83.1%;top:38.3%;width:16.9%;height:43.6%">İksirci</button>
      <button class="cbtn" data-go="demirci" type="button" style="left:3.41%;width:16.5%">Demirci</button>
      <button class="cbtn" data-go="egitim" type="button" style="left:22.97%;width:15.97%">Eğitim Alanı</button>
      <button class="cbtn" data-go="arena" type="button" style="left:41.51%;width:16.93%">Arena</button>
      <button class="cbtn" data-go="zirhci" type="button" style="left:61.12%;width:15.91%">Zırhçı</button>
      <button class="cbtn" data-go="iksirci" type="button" style="left:80.02%;width:16.87%">İksirci</button>
      <button class="medal" data-go="karakter" type="button" aria-label="Karakter"><canvas id="medalCanvas" width="160" height="160"></canvas></button>
      <span class="pts-dot" id="ptsDot" hidden></span>
      <div class="hudbar hb1" id="hbName"></div>
      <div class="hudbar hb2"><i id="hbXpFill"></i><span id="hbXp"></span></div>
      <div class="hudbar hb3" id="hbGold"></div>
      <div class="city-title" id="cityTitle">Vesperum</div>
    </div>
    <div class="row between">
      <span class="note">Bir binaya ya da alttaki butonlara dokun. Karakterin için sol üstteki madalyona dokun.</span>
      <span class="row">
        <button class="btn ghost small" id="citySound" type="button">Ses: Açık</button>
        <button class="btn ghost small" id="cityMenu" type="button">Ana Menü</button>
      </span>
    </div>
  </section>

  <!-- dövüş -->
  <section id="fight" class="screen" hidden>
    <div class="tutbox" id="tutBox" hidden></div>
    <div class="row between">
      <span class="turn" id="turnT"></span>
      <span class="note keys">Tuşlar: A D Q W E R S · 1 iksir</span>
    </div>
    <div class="actions" id="actions">
      <button class="act" data-act="back" type="button"><span class="an">Geri Çekil</span><span class="as"><span>1 adım</span><kbd>A</kbd></span></button>
      <button class="act" data-act="fwd" type="button"><span class="an">İlerle</span><span class="as"><span>2 adıma kadar</span><kbd>D</kbd></span></button>
      <button class="act atk" data-act="quick" type="button"><span class="an">Hızlı Saldırı</span><span class="as"><span data-info></span><kbd>Q</kbd></span></button>
      <button class="act atk" data-act="normal" type="button"><span class="an">Normal Saldırı</span><span class="as"><span data-info></span><kbd>W</kbd></span></button>
      <button class="act atk" data-act="power" type="button"><span class="an">Güçlü Saldırı</span><span class="as"><span data-info></span><kbd>E</kbd></span></button>
      <button class="act" data-act="taunt" type="button"><span class="an">Alay Et</span><span class="as"><span data-info></span><kbd>R</kbd></span></button>
      <button class="act" data-act="rest" type="button"><span class="an">Dinlen</span><span class="as"><span data-info></span><kbd>S</kbd></span></button>
      <button class="act pot" data-act="potions" type="button"><span class="an">İksir</span><span class="as"><span data-info></span><kbd>1</kbd></span></button>
    </div>
    <div class="pot-tray" id="potTray" hidden></div>
    <ul class="log" id="log" aria-live="polite"></ul>
  </section>
</div>

<!-- hikâye sahnesi -->
<div class="scene" id="scene" hidden>
  <div class="scene-card" role="dialog" aria-modal="true" aria-labelledby="sceneTitle">
    <div class="row between"><span class="label" id="sceneTitle"></span><span class="note" id="sceneCount"></span></div>
    <canvas id="sceneCanvas" width="640" height="360"></canvas>
    <div class="scene-text">
      <b id="sceneSpeaker"></b>
      <p id="sceneText"></p>
    </div>
    <div class="row between">
      <button class="btn ghost small" id="sceneSkip" type="button">Sahneyi Geç</button>
      <button class="btn" id="sceneNext" type="button">İleri</button>
    </div>
  </div>
</div>

<!-- şehir pencereleri -->
<div class="win-wrap" id="win" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="win-head">
      <h2 id="winTitle"></h2>
      <span class="win-gold" id="winGold"></span>
      <button class="btn ghost small" id="winClose" type="button">Kapat</button>
    </div>
    <div class="win-body" id="winBody"></div>
  </div>
</div>

<!-- bilgi ve onay penceresi -->
<div class="modal" id="dialog" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <h2 id="dTitle"></h2>
    <div id="dBody" class="dbody"></div>
    <div class="row" id="dBtns"></div>
  </div>
</div>

<!-- sonuç penceresi -->
<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <button class="btn" id="mBtn" type="button">Devam</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/engine.js"></script>
<script src="js/scenes.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
